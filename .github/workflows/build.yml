name: Build page from README

on:
  repository_dispatch:
    types: [readme-updated]
  workflow_dispatch: {}
  schedule:
    - cron: '0 6 * * *'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch README.md from source repo
        run: curl -fsSL https://raw.githubusercontent.com/karlerikjonatan/karlerikjonatan/main/README.md -o README.md

      - name: Render Markdown via GitHub API
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          jq -Rs --arg ctx "karlerikjonatan/karlerikjonatan" '{text: ., mode: "gfm", context: $ctx}' README.md \
            | curl -fsSL -X POST https://api.github.com/markdown \
                -H "Authorization: Bearer ${GH_TOKEN}" \
                -H "Accept: application/vnd.github+json" \
                -H "Content-Type: application/json" \
                -d @- -o body.html

      - name: Inject into template
        run: |
          python3 -c "
          template = open('template.html', encoding='utf-8').read()
          body = open('body.html', encoding='utf-8').read()
          open('index.html', 'w', encoding='utf-8').write(template.replace('{{BODY}}', body))
          "

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --quiet --cached -- index.html || {
            git commit -m "Rebuild index.html from README.md"
            git push
          }
